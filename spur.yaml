projects:
  diary-bot:
    name: "diary-bot"
    path: .
    defaultBranch: main
    sessionPrefix: diary-bot
    symlinks:
      - .env
    sidecars:
      dev:
        command: 'bash -c "ssh root@146.190.110.77 systemctl stop noter 2>/dev/null || true; exec bash scripts/bot-watch.sh"'
        autoStart: false
        idleTtlMinutes: 999999
      landing:
        command: 'python3 -m http.server "${LANDING_PORT:-3080}" --bind 127.0.0.1 --directory landing'
        autoStart: false
        idleTtlMinutes: 999999
        ports:
          landing:
            env: LANDING_PORT
            start: 3080
            end: 3089
            url: "https://{port}.local.intelas.tech"
    sources:
      gh:
        type: github
    triggers:
      # PR merged -> session completes itself and its worktree is removed.
      gh-merged:
        source: gh
        event: github:merged
        send:
          prompt: |
            PR merged. Work done.
            Confirm merge: gh pr view --json state,mergedAt.
            Then run "$SPUR_SESSION_TOOL_DIR/spur-self-destruct" to complete and remove this session.
            Do not start new work. Do not ask questions.
      # PR closed without merge -> same teardown.
      gh-closed:
        source: gh
        event: github:closed
        send:
          prompt: |
            PR closed without merge. Work stopped.
            Run "$SPUR_SESSION_TOOL_DIR/spur-self-destruct" to complete and remove this session.
            Do not start new work. Do not ask questions.
