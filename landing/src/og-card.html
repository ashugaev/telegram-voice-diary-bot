<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=JetBrains+Mono:ital,wght@0,400;0,500;1,500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;background:#14101f;color:#f4ede2;
 font-family:"Unbounded",sans-serif;padding:76px 80px;display:flex;flex-direction:column;justify-content:space-between;
 background-image:radial-gradient(90vw 70vh at 85% -20%,rgba(240,180,41,.16),transparent 60%);}
.eyebrow{font-family:"JetBrains Mono",monospace;font-size:19px;letter-spacing:.16em;text-transform:uppercase;color:#f0b429}
h1{font-size:60px;line-height:.98;letter-spacing:-.035em;font-weight:700;max-width:16ch;margin-top:40px}
em{font-family:"JetBrains Mono",monospace;font-style:italic;font-weight:500;font-size:.86em;color:#f0b429}
.foot{display:flex;align-items:baseline;gap:24px;font-family:"JetBrains Mono",monospace;font-size:20px;color:#a093b8}
.mark{font-family:"Unbounded";font-weight:800;font-size:30px;color:#f4ede2;letter-spacing:-.04em}
.dot{color:#f0b429}
</style></head><body>
<div><p class="eyebrow">voice note &rarr; notion row &rarr; honest reply</p>
<h1>A diary you can talk to. It <em>learns</em> you as it listens.</h1></div>
<div class="foot"><span class="mark">pizdabol<span class="dot">.</span></span><span>voice notes → your notion journal</span></div>
</body></html>
