<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;background:#14101f;color:#f4ede2;
 font-family:"Bricolage Grotesque",sans-serif;padding:76px 80px;display:flex;flex-direction:column;justify-content:space-between;
 background-image:radial-gradient(90vw 70vh at 85% -20%,rgba(240,180,41,.16),transparent 60%);}
.eyebrow{font-family:"JetBrains Mono",monospace;font-size:19px;letter-spacing:.16em;text-transform:uppercase;color:#f0b429}
h1{font-size:84px;line-height:.98;letter-spacing:-.035em;font-weight:700;max-width:16ch;margin-top:40px}
em{font-style:italic;font-weight:500;color:#f0b429}
.foot{display:flex;align-items:baseline;gap:24px;font-family:"JetBrains Mono",monospace;font-size:20px;color:#a093b8}
.mark{font-family:"Bricolage Grotesque";font-weight:800;font-size:30px;color:#f4ede2;letter-spacing:-.04em}
.dot{color:#f0b429}

<div><p class="eyebrow">voice note &rarr; notion row &rarr; honest reply</p>
<h1>Say it out loud. It files the entry, then it <em>argues</em> with you.</h1></div>
<div class="foot"><span class="mark">pizdabol<span class="dot">.</span></span><span>telegram diary bot for notion</span></div>
</body></html>
